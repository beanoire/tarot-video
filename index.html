<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tarot</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;

    }

    .video-wrap {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;

    iframe {

      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div class="video-wrap">
    <iframe
      src="https://player.vimeo.com/video/1220657563?autoplay=1&muted=1&playsinline=1&title=0&byline=0&portrait=0"
      allow="autoplay; fullscreen; picture-in-picture"
